name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest

  rl-hyper-heuristic-cvrp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/rl-hyper-heuristic-cvrp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Dependency check
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: End-to-end smoke benchmark
        run: rlhh-cvrp --config configs/smoke.json --output results/ci-smoke
      - name: Validate smoke outputs
        run: test -s results/ci-smoke/summary.json && test -s results/ci-smoke/metrics.csv && test -s results/ci-smoke/raw_results.jsonl

  comprehensive-workforce-vrp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: projects/comprehensive-workforce-vrp-scipy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Dependency check
        run: python -m pip check
      - name: Compile modules
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
      - name: End-to-end example
        run: python example.py > /tmp/comprehensive-vrp-example.json
